[versions]
detekt = "2.0.0-alpha.6"
kotlin = "2.4.10"
# One compiler-plugin artifact is built per Kotlin version, against the latest patch of each.
kotlinCompiler22 = "2.2.21"
kotlinCompiler23 = "2.3.21"
kotlinCompiler24 = "2.4.10"
ktlintGradle = "13.1.0"
# SKIE, applied for real by the coexistence integration test. It must support the `kotlin`
# version above, or it fails the build instead of loading.
skie = "0.10.14"
pluginPublish = "1.3.1"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin"}
detekt = { id = "dev.detekt", version.ref = "detekt"}
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle"}
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish"}

[libraries]
junit = "junit:junit:4.13.2"
# The Gradle plugin compiles against the OLDEST supported KGP: a plugin built against a newer one
# can hit NoSuchMethodError on an older Gradle build, the reverse is far less likely.
kotlin-gradle-plugin-min = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinCompiler22" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-native-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-native-compiler-embeddable", version.ref = "kotlin" }
