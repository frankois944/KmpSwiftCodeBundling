name: Pre Merge Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  plugin:
    name: Build and check the plugin
    runs-on: ubuntu-latest
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cache Gradle Caches
        uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle tasks
        run: ./gradlew -p plugin-build check validatePlugins --continue

  example:
    name: Bundle Swift code into the example framework
    runs-on: macos-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cache Gradle Caches
        uses: gradle/actions/setup-gradle@v4
      - name: Link the example framework
        run: ./gradlew :example:linkDebugFrameworkIosSimulatorArm64
      - name: Verify the Swift module was bundled into the framework
        run: |
          FRAMEWORK=example/build/bin/iosSimulatorArm64/debugFramework/ExampleKit.framework
          test -f "$FRAMEWORK/Headers/ExampleKit-Swift.h"
          test -f "$FRAMEWORK/Modules/ExampleKit.swiftmodule/arm64-apple-ios-simulator.swiftmodule"
          grep -q "module ExampleKit.Swift" "$FRAMEWORK/Modules/module.modulemap"
          nm -gU "$FRAMEWORK/ExampleKit" | grep -q "SwiftGreeter"
