ID=io.github.frankois944.kmpSwiftCodeBundling
VERSION=1.0.0
GROUP=io.github.frankois944.kmpSwiftCodeBundling
DISPLAY_NAME=KMP Swift Code Bundling
DESCRIPTION=Bundles Swift code into Kotlin Multiplatform projects
WEBSITE=https://github.com/frankois944/KmpSwiftCodeBundling
VCS_URL=https://github.com/frankois944/KmpSwiftCodeBundling
IMPLEMENTATION_CLASS=io.github.frankois944.kmpSwiftCodeBundling.SwiftCodeBundlingPlugin

kotlin.compiler.execution.strategy=in-process

# The integration tests run nested Gradle builds inside the test JVM, which exhausts the defaults.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
